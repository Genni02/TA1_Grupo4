name: PagaYa Digital Wallet - CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. ETAPA DE COMPILACIÓN Y EVALUACIÓN DE REGRESIÓN
  build_and_test:
    name: Build & Financial Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Compilación e Instalación de Dependencias
        run: npm ci

      - name: Pruebas Automatizadas y Regresión Financiera (Saldos y Redondeo)
        run: npm run test:regression

  # 2. ETAPA DE ANÁLISIS DE SEGURIDAD (SAST & DEPENDENCIAS)
  security_scan:
    name: SAST & Security Audit
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Auditoría de Seguridad de Dependencias (npm audit)
        run: npm run audit:security

  # 3. ETAPA DE DESPLIEGUE EN STAGING
  deploy_staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [build_and_test, security_scan]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging-api.pagaya.com

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Desplegar a Entorno Staging
        run: |
          echo "🚀 Desplegando versión a Staging..."
          sleep 1

      - name: Registro de Auditoría Staging
        env:
          DEPLOY_ENV: staging
          ROLLOUT_PERCENTAGE: 100%
          DEPLOY_STATUS: SUCCESS
        run: node scripts/audit-logger.js

  # 4. ETAPA DE DESPLIEGUE CANARIO (GRADUAL 10% DE USUARIOS)
  deploy_canary:
    name: Deploy Canary (10% Traffic)
    runs-on: ubuntu-latest
    needs: deploy_staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-canary
      url: https://canary-api.pagaya.com

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar Despliegue Canario (10% de Usuarios)
        run: |
          echo "🐤 Liberando nueva versión al 10% de los usuarios de PagaYa..."
          sleep 1

      - name: Verificación de Métricas de Salud (Canary Health Check)
        run: |
          echo "🔍 Verificando tasa de errores y cálculo de saldos en tráfico Canario..."
          echo "✅ 0% errores de redondeo detectados en el grupo canario."

      - name: Registro de Auditoría Despliegue Canario
        env:
          DEPLOY_ENV: production-canary
          ROLLOUT_PERCENTAGE: 10%
          DEPLOY_STATUS: SUCCESS
        run: node scripts/audit-logger.js

  # 5. ETAPA DE DESPLIEGUE A PRODUCCIÓN COMPLETA (100% DE USUARIOS)
  deploy_production:
    name: Deploy Production (100% Rollout)
    runs-on: ubuntu-latest
    needs: deploy_canary
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.pagaya.com

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Despliegue Total a Producción (100% Tráfico)
        run: |
          echo "🌐 Promoviendo versión al 100% de usuarios en Producción PagaYa..."
          sleep 1

      - name: Registro Final de Auditoría de Producción
        env:
          DEPLOY_ENV: production
          ROLLOUT_PERCENTAGE: 100%
          DEPLOY_STATUS: SUCCESS
        run: node scripts/audit-logger.js
